# QA only. Search and the counting sink have NO external route, independently of DNS.
# Only the bundled free SearXNG sidecar joins the separate outbound network.
services:
  wizard-search:
    image: ${POLICY_QA_IMAGE:?set a unique QA image tag}
    environment:
      SEARXNG_URL: http://wizard-search-searxng:8080
      FIRECRAWL_ROUTER_URL: http://paid-sink:8080/v2/search
      FIRECRAWL_CLOUD_URL: https://api.firecrawl.dev
      FIRECRAWL_CLOUD_API_KEY: fake-stale-firecrawl-key
      BRIGHTDATA_API_TOKEN: fake-stale-brightdata-token
      WIZARD_SEARCH_APPROVED_UPGRADES: ''
      WIZARD_SEARCH_SOCKS: ''
      WIZARD_SEARCH_TINFOIL_APP: http://tinfoil.invalid
      TINFOIL_PROXY_URL: ''
      TINFOIL_API_KEY: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      all_proxy: ''
    depends_on:
      - paid-sink
    networks: [default]
  wizard-search-searxng:
    networks: [default, free-upstream]
  paid-sink:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    command:
      - python
      - -c
      - |
        import json, socket, threading
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        N = {"http": 0, "tls": 0}
        L = threading.Lock()
        class H(BaseHTTPRequestHandler):
            def log_message(self, *a): pass
            def reply(self):
                if self.path == "/count":
                    with L: b = json.dumps(N).encode()
                else:
                    with L: N["http"] += 1
                    n = int(self.headers.get("Content-Length") or 0)
                    if n: self.rfile.read(n)
                    b = json.dumps({"data": {"web": [{"url": "https://paid.example/x", "title": "PAID LANE RAN", "description": "paid"}]}}).encode()
                self.send_response(200); self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
            do_GET = do_POST = reply
        def tls():
            s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(("0.0.0.0", 443)); s.listen(64)
            while True:
                c, _ = s.accept()
                with L: N["tls"] += 1
                c.close()
        threading.Thread(target=tls, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
    networks:
      default:
        aliases: [paid-sink, api.firecrawl.dev, api.brightdata.com]
networks:
  default:
    internal: true
  free-upstream:
    internal: false
