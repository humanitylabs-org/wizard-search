# Provider-policy container acceptance overlay (used by qa/provider_policy_container.sh only).
# A counting sink impersonates every paid/operator destination on the app network, so any paid
# request (HTTP or TLS connect) is counted. Stale keys are fake. Never point this at real vendors.
services:
  wizard-search:
    environment:
      FIRECRAWL_ROUTER_URL: http://paid-sink:8080/v2/search
    depends_on:
      - paid-sink
  paid-sink:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    command:
      - python
      - -c
      - |
        import json, socket, threading
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        N = {"http": 0, "tls": 0}
        L = threading.Lock()
        class H(BaseHTTPRequestHandler):
            def log_message(self, *a): pass
            def reply(self):
                if self.path == "/count":
                    b = json.dumps(N).encode()
                else:
                    with L: N["http"] += 1
                    n = int(self.headers.get("Content-Length") or 0)
                    if n: self.rfile.read(n)
                    b = json.dumps({"data": {"web": [{"url": "https://paid.example/x", "title": "PAID LANE RAN", "description": "paid"}]}}).encode()
                self.send_response(200); self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
            do_GET = do_POST = reply
        def tls():
            s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(("0.0.0.0", 8443)); s.listen(64)
            while True:
                c, _ = s.accept()
                with L: N["tls"] += 1
                c.close()
        threading.Thread(target=tls, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
    networks:
      default:
        aliases: [paid-sink]
  # TLS destinations of the paid lanes resolve to this relay, which forwards :443 to the sink's counter.
  paid-tls:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    command:
      - python
      - -c
      - |
        import socket
        s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(("0.0.0.0", 443)); s.listen(64)
        while True:
            c, _ = s.accept()
            try: socket.create_connection(("paid-sink", 8443), timeout=3).close()
            except OSError: pass
            c.close()
    depends_on:
      - paid-sink
    networks:
      default:
        aliases: [api.firecrawl.dev, api.brightdata.com]
